<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1a1b1f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>BuscaMinas: Héroes del Abismo</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#222;--mut:#777;--cell:#cfc8b8;--open:#ece7da;--acc:#e0562b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1b1f;--card:#26282e;--tx:#eee;--mut:#9a9da6;--cell:#4a4e59;--open:#2f323a;--acc:#ff7a4d}}
:root[data-theme="dark"]{--bg:#1a1b1f;--card:#26282e;--tx:#eee;--mut:#9a9da6;--cell:#4a4e59;--open:#2f323a;--acc:#ff7a4d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:480px;margin:0 auto;padding:14px 12px 24px}
h1{margin:6px 0 2px;font-size:26px}h2{font-size:14px;color:var(--mut);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--tx);background:var(--card);border:2px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer}
button.on{border-color:var(--acc)}
.card{flex:1 1 30%;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:96px}
.card b{font-size:30px}.card small{color:var(--mut);font-size:11px;text-align:center}
.go{width:100%;margin-top:20px;background:var(--acc);color:#fff;font-weight:700;font-size:18px;padding:14px}
.hud{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:4px}
.msg{min-height:24px;text-align:center;font-weight:600;margin:4px 0 8px}
#grid{display:grid;gap:3px;touch-action:none}
.c{aspect-ratio:1;border-radius:6px;background:var(--cell);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(12px,4.6vw,20px)}
.c.o{background:var(--open)}.c.x{background:#e5484d}
.bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.bar button{flex:1;padding:10px 6px}
.ab{flex:2 1 100%;font-weight:700;background:linear-gradient(90deg,var(--acc) var(--p),var(--card) var(--p));opacity:.85}
.ab.rdy{opacity:1}
.hint{color:var(--mut);font-size:12px;text-align:center;margin-top:10px}
.hud button{padding:6px 8px}
.hid{display:none!important}
.top{margin-bottom:8px}.tt p{line-height:1.5;margin:0 0 6px;font-size:14px}.top button{padding:6px 12px;font-size:14px}
:root[data-theme="neon"]{--bg:#0b0b1a;--card:#171733;--tx:#e8f7ff;--mut:#8aa4c8;--cell:#2a2a5a;--open:#12122b;--acc:#00f0ff}
:root[data-theme="retro"]{--bg:#c9b98a;--card:#e8dbb0;--tx:#3b2f1a;--mut:#6b5b3a;--cell:#a8946a;--open:#efe3bf;--acc:#b5432a}
.rc{display:flex;flex-wrap:wrap;gap:8px}.rc div{flex:1 1 28%;background:var(--card);border-radius:12px;padding:8px;text-align:center}.rc b{display:block;font-size:20px}
.hs div{display:flex;justify-content:space-between;gap:8px;background:var(--card);border-radius:10px;padding:8px 10px;margin-bottom:4px}
.hs small,.rc small{color:var(--mut)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fx::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 35%,var(--c) 130%);opacity:0;animation:fl .9s ease-out}
.fx i{position:absolute;border-radius:50%;width:40px;height:40px;border:4px solid var(--c);animation:ring .9s ease-out forwards}
.fx i:nth-child(2){animation-delay:.15s}
.fx b{position:relative;font-size:80px;animation:pop .9s ease-out forwards}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(22);opacity:0}}
@keyframes fl{0%{opacity:0}25%{opacity:.6}100%{opacity:0}}
@keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.3);opacity:1}100%{transform:scale(1.8);opacity:0}}

.win{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.win .cf{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;opacity:0;animation:cf var(--d) ease-in forwards}
.win .tr{position:absolute;left:50%;top:36%;font-size:104px;line-height:1;animation:tr 2.8s ease-out forwards}
.win .tx{position:absolute;left:0;right:0;top:52%;text-align:center;font-size:34px;font-weight:900;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7);animation:tx 2.8s ease-out forwards}
.win::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(245,179,1,.55),transparent 65%);opacity:0;animation:fl 1.4s ease-out}
@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(var(--dx),108vh) rotate(var(--r))}}
@keyframes tr{0%{transform:translate(-50%,-50%) scale(0) rotate(-25deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.5) rotate(10deg);opacity:1}32%{transform:translate(-50%,-50%) scale(1) rotate(0)}85%{transform:translate(-50%,-50%) scale(1.08);opacity:1}100%{transform:translate(-50%,-50%) scale(1.1);opacity:0}}
@keyframes tx{0%,15%{transform:scale(.4);opacity:0}30%{transform:scale(1.15);opacity:1}40%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.win .cf{display:none}}
/* batalla */
.bt{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle,rgba(40,10,10,.92),rgba(0,0,0,.96));animation:bti .25s ease-out,bto .4s ease-in 2.2s forwards}
.bt-t{font-size:30px;font-weight:900;color:#fff;text-shadow:0 2px 14px #e5484d;text-align:center;animation:btt .7s ease-out .5s both}
.bt-r{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 4%}
.bt-h,.bt-e{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:15px;max-width:38vw}
.bt-h svg,.bt-e svg{width:min(34vw,150px);height:auto;box-shadow:0 0 24px rgba(255,255,255,.25)}
.bt-h{animation:bth .55s cubic-bezier(.2,1.2,.4,1) both}.bt-e{animation:bte .55s cubic-bezier(.2,1.2,.4,1) .1s both}
.bt-v{font-size:54px;font-weight:900;color:#f5b301;text-shadow:0 0 18px #e5484d;animation:btv .45s ease-out .5s both}
.bt-s{color:#9a9da6;font-size:12px;animation:btt .4s 1s both}
.shk{animation:shk .45s ease-out .55s}
@keyframes bti{from{opacity:0}to{opacity:1}}@keyframes bto{to{opacity:0;visibility:hidden}}
@keyframes bth{from{transform:translateX(-90vw) rotate(-8deg)}to{transform:none}}
@keyframes bte{from{transform:translateX(90vw) rotate(8deg)}to{transform:none}}
@keyframes btv{0%{transform:scale(3);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
@keyframes btt{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
@media (prefers-reduced-motion:reduce){.bt *,.shk{animation-duration:.01s!important;animation-delay:0s!important}}
/* decisiones */
.op{width:100%;margin-top:10px;text-align:left;border:2px solid var(--acc);font-weight:600}.op small{display:block;color:var(--mut);font-weight:400;margin-top:2px}.op[disabled]{opacity:.45;border-color:transparent;cursor:default}.tt p.ns{color:var(--mut);font-size:13px}
input{font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:10px 12px;width:100%;-webkit-user-select:text;user-select:text}
</style></head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),rnd=n=>Math.floor(Math.random()*n);
const RX={ok:[['🙂','Todo tranquilo…'],['😌','Vamos bien']],big:[['😄','¡Qué alivio!'],['🥳','¡Se abrió un montón!']],num:[['😰','Uy, hay minas cerca…'],['😬','Esto se pone tenso']],boom:[['😱','¡AAAH!'],['🤕','¡Eso dolió!']],shield:[['😮‍💨','¡Uf, por poco!']],flag:[['🧐','Aquí huele a mina…']],unflag:[['🤔','Mejor lo pienso…']],low:[['😨','¡Solo me queda una vida!']],streak:[['😎','¡Voy en racha!']],skill:[['✨','¡Mi habilidad!']],win:[['🥳','¡Lo logré!']],lose:[['😵','Esta vez no pudo ser…']]};
const rxs=k=>{G.rx=RX[k][rnd(RX[k].length)]};
const CH=[{id:'scout',n:'Exploradora',e:'🧭',a:'Radar',d:'Revela una casilla segura'},
{id:'eng',n:'Ingeniero',e:'🛠️',a:'Escudo',d:'Desactiva la próxima mina que pises'},
{id:'seer',n:'Vidente',e:'🔮',a:'Visión',d:'Marca las minas de un área 3x3'},{id:'hunt',n:'Cazador',e:'🏹',a:'Ráfaga',d:'Despeja una fila segura',cost:100},{id:'med',n:'Médico',e:'💚',a:'Cura',d:'Recupera 1 vida',cost:150},{id:'hack',n:'Hacker',e:'💾',a:'Hackeo',d:'Desactiva una mina',cost:200}];
const LORE={scout:{h:'Lyra',a:'Faro de Lyra',s:'Guardabosques de Aurora. Su brújula, robada al Rey Sin Rostro, se enciende y revela un camino seguro en medio de la oscuridad.'},eng:{h:'Brann',a:'Escudo de Forja',s:'Herrero de las murallas. Levanta un escudo de acero ardiente que se traga la próxima explosión.'},seer:{h:'Nox',a:'Ojo de Nox',s:'Oráculo que ve mejor con los ojos cerrados. Siente dónde duermen las minas en un área cercana.'},hunt:{h:'Kael',a:'Lluvia de Kael',s:'Arquero del norte. Dispara una lluvia de flechas que despeja una fila entera del campo.'},med:{h:'Sol',a:'Luz Vital',s:'Sanadora del templo. Su luz cierra las heridas y te devuelve una vida.'},hack:{h:'Byte',a:'Código Cero',s:'Viajero del tiempo atrapado en la época medieval: por eso es un hacker entre espadas. Su reloj del futuro reescribe la runa de una mina y la apaga para siempre.'}};
CH.forEach(c=>{const l=LORE[c.id];c.a=l.a;c.n+=' '+l.h;c.s=l.s});
const DF={'Fácil':{w:8,h:10,m:10,l:3},'Medio':{w:9,h:13,m:22,l:2},'Difícil':{w:10,h:15,m:40,l:1}};
const COL=['','#2f7de1','#2e9e55','#e5484d','#7a4fd1','#c2410c','#0e9aa7','#444','#888'];
let S={mode:'normal',ch:0,df:'Fácil'},G;
function menu(){home()}
function start(){const pl=S.mode=='plain',hc=S.mode=='hard',inf=S.mode=='inf',d=hc?{w:10,h:15,m:45,l:1}:S.mode=='daily'?DF['Medio']:DF[S.df];G={mode:S.mode,inf,cx:0,cy:0,map:new Map(),seed:rnd(1e9),dens:[.12,.17,.22][Object.keys(DF).indexOf(S.df)],w:inf?9:d.w,h:inf?13:d.h,m:d.m,lives:inf||pl?1:d.l,hint:hc||pl?0:1,det:hc||pl?0:1,en:0,need:pl?1e9:hc?30:15,cb:0,tl:90,R:S.mode=='daily'?mk(+new Date().toISOString().slice(0,10).replace(/-/g,'')):0,rv:0,sc:0,t0:0,given:0,shield:0,seer:0,flag:0,first:1,over:0,msg:inf?'♾️ Arrastra el tablero para moverte':hc?'💀 Hardcore: 1 vida, sin ayudas':'',g:[]};
for(let y=0;y<G.h;y++){G.g[y]=[];for(let x=0;x<G.w;x++)G.g[y][x]={m:0,r:0,f:0,n:0,x:0,d:0}}draw()}
const C=(x,y)=>{if(!G.inf)return G.g[y][x];const k=x+','+y;let c=G.map.get(k);if(!c){c={m:hm(x,y),r:0,f:0,n:0,x:0,d:0};c.gm=c.m&&Math.abs(x*3+y*7)%9==0;G.map.set(k,c);c.n=nb(x,y).filter(p=>mineAt(...p)).length}return c};
const nb=(x,y)=>{const a=[];for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const X=x+i,Y=y+j;if((i||j)&&(G.inf||(X>=0&&Y>=0&&X<G.w&&Y<G.h)))a.push([X,Y])}return a};
function calc(){if(G.inf){for(const [k,c] of G.map){const [x,y]=k.split(',').map(Number);c.n=nb(x,y).filter(p=>mineAt(...p)).length}return}for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++)C(x,y).n=nb(x,y).filter(p=>C(...p).m).length}
function place(sx,sy){if(G.inf){G.sx=sx;G.sy=sy;G.map.clear();return}let k=0;while(k<G.m){const x=(G.R||rnd)(G.w),y=(G.R||rnd)(G.h);if((Math.abs(x-sx)<2&&Math.abs(y-sy)<2)||C(x,y).m)continue;C(x,y).m=1;C(x,y).gm=(G.R||rnd)(8)==0;k++}calc()}
function drop(){sfx('drop');const r=rnd(3);if(r==0){G.lives++;G.msg='🎁 ¡Vida extra!'}else if(r==1){G.hint++;G.msg='🎁 Pista +1'}else{G.det++;G.msg='🎁 Detector +1'}}
function flood(x,y){const st=[[x,y]];let cap=0;while(st.length&&cap++<4000){const [a,b]=st.pop(),c=C(a,b);if(c.r||c.m||(isIce(a,b)&&!c.ic&&!(a==x&&b==y)&&G.mode!='plain'))continue;c.r=1;c.f=0;G.rv++;G.tl+=.4;G.sc+=Math.round(10*(1+(G.mode=='plain'?0:Math.min(G.cb,20))/10));if(!c.n&&(a*7+b*13)%11==3){c.g=1;G.sc+=40}G.en=Math.min(G.need,G.en+1);if(!c.n)nb(a,b).forEach(p=>st.push(p))}
const k=G.mode=='hard'||G.mode=='plain'?0:Math.floor(G.rv/20);while(G.given<k){G.given++;drop()}}
function hit(c){G.cb=0;if(G.shield){fx('🛡️','#f5b301');G.shield=0;c.m=0;c.r=1;c.d=1;if(c.gm)G.sc+=100;calc();G.msg='🛡️ ¡Mina desactivada!'}else{fx('💥','#e5484d');c.r=1;c.x=1;G.lives--;G.msg='💥 -1 vida';if(G.lives<=0){G.over=-1;G.msg='💀 Perdiste'}}}
function check(){if(G.over||G.inf)return;if(G.g.every(r=>r.every(c=>c.m||c.r))){G.over=1;G.msg='🎉 ¡Ganaste!'}}
function open(x,y){const c=C(x,y);if(c.r)return;if(c.f){G.msg='🚩 Tiene bandera: mantén pulsado para quitarla';return}if(!G.first&&isIce(x,y)&&!c.ic&&G.mode!='plain'){c.ic=1;G.msg='🧊 Hielo roto, toca otra vez';sfx('flag');return}if(G.first){G.first=0;G.t0=Date.now();place(x,y)}if(C(x,y).m){const s0=G.shield;hit(C(x,y));rxs(s0?'shield':G.lives==1&&G.lives<3?'low':'boom')}else{G.cb++;G.mc=Math.max(G.mc||0,G.cb);const r0=G.rv;flood(x,y);sfx('open');const n=G.rv-r0;rxs(G.cb>=6?'streak':n>=10?'big':C(x,y).n>=3?'num':'ok')}check()}
function safe(){const l=allCells().filter(a=>!a[2].r&&!a[2].m).map(a=>[a[0],a[1]]);if(!l.length)return 0;const [x,y]=l[rnd(l.length)];flood(x,y);check();return 1}
function act(x,y,long){if(G.over)return;G.msg='';const c=C(x,y);
if(G.seer&&!G.first){[[x,y],...nb(x,y)].forEach(p=>{const q=C(...p);if(q.m&&!q.r)q.f=1});G.seer=0;G.en=0;fx('🔮','#9b5de5');G.msg='🔮 Minas reveladas';draw();return}
if(!!G.flag!=!!long){if(!c.r){c.f^=1;rxs(c.f?'flag':'unflag');sfx('flag')}}else open(x,y);draw()}
function ability(){if(G.over||G.first||G.en<G.need)return;G.msg='';rxs('skill');const id=CH[S.ch].id;
if(id=='scout'){if(safe()){G.en=0;fx('🧭','#22c1c3');G.msg='🧭 Casilla segura abierta'}}
else if(id=='hack'){hack();G.en=0}else if(id=='hunt'){row();G.en=0}else if(id=='med'){G.lives++;G.en=0;fx('💚','#2ecc71');G.msg='💚 +1 vida'}else if(id=='eng'){if(!G.shield){G.shield=1;G.en=0;fx('🛡️','#f5b301');G.msg='🛡️ Escudo activo'}}
else{G.seer=!G.seer;if(G.seer)fx('🔮','#9b5de5');G.msg=G.seer?'🔮 Toca el centro del área':''}draw()}
function useHint(){if(G.over||G.first||G.hint<1)return;if(safe()){G.hint--;G.msg='🔍 Pista usada'}draw()}
function useDet(){if(G.over||G.first||G.det<1)return;const l=allCells().filter(a=>a[2].m&&!a[2].f).map(a=>a[2]);if(l.length){l[rnd(l.length)].f=1;G.det--;G.msg='📡 Mina marcada'}draw()}
function rem(){if(G.inf||G.first||G.over)return'';const r=cellsAll().filter(c=>!c.m&&!c.r);return '🧱 Faltan '+r.length+' casillas seguras'+(r.length&&r.every(c=>c.f)?' (¡revisa tus banderas 🚩, hay seguras marcadas!)':'')+'<br>'}
function draw(){if(G.over&&!G.fin){G.fin=1;G.mode=='car'?carEnd():(finish(),ach());rxs(G.over==1?'win':'lose')}const fl=cellsAll().filter(c=>c.f).length;
const cells=Array.from({length:G.h},(_,j)=>Array.from({length:G.w},(_,i)=>{const x=i+G.cx,y=j+G.cy,c=C(x,y);let t='',k='c';
if(c.x){t='💥';k+=' x'}else if(c.d){t='🛡️';k+=' o'}else if(c.r){k+=' o';t=c.n?`<span style="color:${COL[c.n]}">${c.n}</span>`:c.g?'💎':''}
else if(G.over==-1&&c.m){t=c.gm?'🪙':'💣'}else if(c.f)t='🚩';
if(!c.r&&!c.f&&!c.x&&isIce(x,y)&&G.mode!='plain'&&!(G.over==-1&&c.m))t=c.ic?'❄️':'🧊';return `<div class="${k}" data-x=${x} data-y=${y}>${t}</div>`}).join('')).join('');
const ch=CH[S.ch],p=Math.round(G.en/G.need*100),rdy=G.en>=G.need&&!G.first;
$('#app').innerHTML=`<div class=top style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:800;color:var(--acc)">${G.lab||'⚔️ Héroes del Abismo'}</span><button onclick="menu()">← Menú</button></div><div class=hud><span>${'❤️'.repeat(G.lives)||'💀'}${G.shield?' 🛡️':''}</span><span>🚩 ${G.inf?fl:G.m-fl}</span><span>⭐ ${G.sc}${G.cb>4&&G.mode!='plain'?' 🔥x'+(1+Math.min(G.cb,20)/10).toFixed(1):''}</span>${G.mode=='time'||G.mode=='car'?'<span id=tm>⏱️ '+rt()+'</span>':''}<span><button onclick="theme()">🌓</button> <button onclick="mute()">${M?'🔇':'🔊'}</button> <button onclick="menu()">☰</button></span></div>
<div class=rx style="display:flex;align-items:center;gap:8px;justify-content:center;margin:2px 0">${pt(CH[S.ch].id,36)}<span style="background:var(--card);border-radius:14px;padding:6px 10px;font-size:14px">${(G.rx||['🤞','¡Vamos allá!']).join(' ')}</span>${G.ez?ezp(G.ez,36):''}</div><div class=msg>${G.msg||'&nbsp;'}</div>
<div id=grid style="grid-template-columns:repeat(${G.w},1fr)">${cells}</div>
<div class=bar><button class="${G.flag?'':'on'}" onclick="G.flag=0;draw()">👆 Abrir</button><button class="${G.flag?'on':''}" onclick="G.flag=1;draw()">🚩 Marcar</button><button class="${G.mode=='plain'?'hid':''}" onclick="useHint()">🔍 ${G.hint}</button><button class="${G.mode=='plain'?'hid':''}" onclick="useDet()">📡 ${G.det}</button>
<button class="ab ${G.mode=='plain'?'hid':''} ${rdy?'rdy':''} ${G.seer?'on':''}" style="--p:${p}%" onclick="ability()">${ch.e} ${ch.a} ${rdy?'(¡lista!)':p+'%'}</button>
${G.inf&&!G.over&&!G.first?'<button onclick="retire()" style="flex:2 1 100%">🏁 Cobrar puntos y terminar</button>':''}${G.over?(G.mode=='car'?(G.over==1?'<button class=go style="margin-top:4px" onclick="carNext()">Continuar ▶</button>':'<button class=go style="margin-top:4px" onclick="startLv()">↻ Reintentar</button><button onclick="map()" style="flex:2 1 100%">🗺️ Mi carrera</button>'):'<button class=go style="margin-top:4px" onclick="start()">Jugar otra vez</button>'):''}</div>

{t:'El murciélago te mira con la cabeza ladeada: parece reconocer tu silbido.',o:[{b:'Silbarle de vuelta',r:'Le silbas y responde. Con un par de aleteos te señala un camino sin minas.',e:{m:-.1}},{b:'Lanzarle una piedra',r:'Huye herido. El campo queda silencioso y tenso.',e:{lz:-1,c:10}}]},
{t:'Los murciélagos dejaron marcas en el techo: un mensaje que apenas se ve.',o:[{b:'Descifrar el mensaje',r:'Dice: «No confíes en la ayuda gratis». Anotas el consejo.',e:{h:1,t:-.05}},{b:'Ignorarlo',r:'Sea lo que sea, no cambia tu ruta.',e:{t:.08}}]}]};
const MJ={
'0-2':()=>({h:'🛡️ Bajo los escombros',t:'Tras vencer a la criatura, oyes golpes bajo unas vigas caídas. Una guardia de Aurora llamada Ilse está atrapada: «¡Ayuda!». Un poco más allá hay un cofre de suministros de la guardia, abierto y lleno.',o:[{b:'Rescatar a Ilse',s:'Pierdes un poco de tiempo.',r:'Entre los dos levantan la viga. Ilse tose, sonríe y se une a ti: «Conozco cada rincón de estas murallas».',e:{al:'ilse',lz:1,t:-.1}},{b:'Tomar los suministros y seguir',s:'Ayudas ahora.',r:'Los gritos se apagan detrás de ti. Los suministros ayudan, pero el silencio pesa.',e:{h:2,d:1,lz:-1,f:'dejoIlse'}}]}),
'0-5':()=>({h:'🔴 La runa de Vorn',t:'La criatura cae y de su pecho se desprende una runa roja que late. Hilos rojos se pierden hacia la torre: es la runa de lealtad que encadena a Vorn. Si la rompes, estará más débil… pero el Rey lo notará. Si la guardas, quizá puedas liberarlo después.',o:[{b:'Romper la runa',s:'Vorn será más débil.',r:'La runa estalla en chispas. Desde la torre llega un rugido… y luego silencio. Vorn está más débil y más furioso.',e:{bx:{t:.15},f:'runaRota'}},{b:'Guardar la runa',s:'Vorn seguirá entero, pero podrías liberarlo.',r:'La runa se enfría en tu mano. Vorn sigue entero, pero quizá puedas devolverle algo más tarde.',e:{bx:{m:.1},f:'runaVorn',lz:1}}]}),
'0-8':()=>({h:'🌙 La noche antes',t:'Cae la noche frente a la torre de Vorn. Desde el campamento oyes su armadura crujir, vigilando. Mañana será el duelo. ¿Cómo pasas la noche?',o:[{b:'Descansar y curar heridas',s:'Más vidas en el duelo.',r:'Duermes poco, pero bien. Al amanecer, tus manos ya no tiemblan.',e:{bx:{l:1}}},{b:'Colarte en la armería de Vorn',s:'Más tiempo, una pista y un detector.',r:'Entre estantes oxidados encuentras planos de la torre y herramientas útiles. Pero te cuesta la noche entera.',e:{bx:{t:.12},h:1,d:1}}]}),
'0-9':()=>K.f.runaVorn?({h:'⚔️ Vorn cae',t:'Mientras las puertas se abren, la runa que guardas arde en tu mano: tiene el nombre de Vorn grabado por dentro. Podrías romperla y liberarlo, o dejarlo caer y tomar su martillo.',o:[{b:'Romper la runa y liberarlo',r:'La runa se deshace en polvo. Vorn parpadea, sorprendido de sus propias manos. «Fui capitán… fui amigo… gracias, {n}». Se une a tu causa.',e:{al:'vorn',lz:2}},{b:'Dejarlo caer y tomar el martillo',r:'Vorn se desmorona sin protestar. El martillo pesa más de lo que parece.',e:{c:35,lz:-1,h:1}}]}):({h:'⚔️ Vorn cae',t:'Mientras las puertas se abren, ves que sin runa los ojos de Vorn son humanos por primera vez en mil años. Murmura el nombre de su capitana, a quien debía proteger. Su martillo queda a tus pies.',o:[{b:'Honrar su memoria',r:'Entierras el martillo bajo las puertas, como una lápida. Las piedras parecen suspirar.',e:{lz:1,h:1}},{b:'Tomar su martillo',r:'El martillo es tuyo ahora. Lo cargas con el peso de lo que no dijiste.',e:{c:35,lz:-1}}]}),
'1-3':()=>({h:'🌫️ Viajeros en el humo',t:'El humo se hace tan espeso que apenas ves tus manos. Entre toses distingues a unos viajeros perdidos: una familia de Aurora, con un niño que no suelta una linterna.',o:[{b:'Guiarlos fuera del humo',s:'Ganas tiempo después.',r:'Los llevas a un claro. El niño te regala su linterna: «Para que no te pierdas tú también».',e:{lz:1,f:'viajeros',t:-.12,h:1}},{b:'Indicarles la salida y seguir',s:'Ganas tiempo ahora.',r:'Les señalas la salida desde lejos. Ganas tiempo, pero la linterna del niño se va con ellos.',e:{t:.1}}]}),
'1-6':()=>({h:'🔥 La raíz del sendero',t:'Una raíz gruesa bloquea el sendero. Junto a ella hay una antorcha clavada en la tierra: el fuego la quemaría en segundos. También puedes cortarla con cuidado, pero toma tiempo.',o:[{b:'Quemar la raíz',s:'Más tiempo.',r:'El fuego abre el paso. El bosque entero gime como un animal herido.',e:{t:.15,lz:-1,f:'fuego'}},{b:'Cortarla con cuidado',s:'Menos tiempo, pero una pista.',r:'Tardas, pero la raíz se aparta sola, casi agradecida.',e:{t:-.05,lz:1,f:'cuido',h:1}}]}),
'1-10':()=>({h:'👑 Fragmento de la Corona',t:'Entre las raíces late un fragmento negro de la Corona Rota. Su calor te llama por tu nombre, {n}. Puedes tomarlo o dejarlo enterrado.',o:[{b:'Tomar el fragmento',s:'Poder ahora… y un camino al final.',r:'El fragmento se hunde en tu mochila. Susurra: «Quien me porte no tendrá miedo». Quizá tampoco tendrá freno.',e:{f:'corona',lz:-1,c:30,l:1}},{b:'Dejarlo enterrado',r:'Cubres el fragmento con tierra. El bosque suspira y las luciérnagas giran a tu alrededor.',e:{lz:1,t:.1}}]}),
'1-13':()=>({h:'🌱 El último brote',t:'En el centro del bosque hay un brote verde, tímido, rodeado de ceniza. Es lo último vivo de lo que Morwen fue. Puedes plantarlo en tierra fértil o quemarlo para quebrarla.',o:[{b:'Plantarlo',s:'Morwen vacilará.',r:'Lo plantas con cuidado. Todo el bosque se inclina, como si recibiera una buena noticia.',e:{f:'brote',lz:1,bx:{t:.1}}},{b:'Quemarlo',s:'Menos minas en el duelo.',r:'El brote se vuelve carbón. A lo lejos, un grito de dolor te dice que Morwen lo sintió.',e:{f:'quemoBrote',lz:-1,bx:{m:-.12}}}]}),
'1-14':()=>({h:'🕸️ Morwen se deshace',t:'Además de la llave negra, entre las cenizas de Morwen queda un puñado de semillas negras que laten.',o:[{b:'Plantar una semilla y dejarla renacer',r:'En el suelo brota un árbol joven. Entre las hojas, por un momento, ves el rostro de Morwen, tranquilo.',e:{lz:1,f:'morwenRenace',h:1}},{b:'Llevarte las semillas',r:'Las semillas pesan poco y valen mucho.',e:{c:40,lz:-1}}]}),
'2-4':()=>({h:'⛓️ Las jaulas',t:'Las jaulas cuelgan sobre el vacío. En una de ellas, {h}, tu compañero héroe, te hace señas. La cadena está sostenida por una runa; si la liberas, el Abismo se agita.',o:[{b:'Liberar a {h}',s:'Ganas un compañero.',r:'La cadena cede y {h} cae en tus brazos. «Sabía que vendrías», dice. Desde ahora caminan juntos.',e:{al:'hero',lz:1,t:-.12}},{b:'Dejarlo por ahora',r:'Prometes volver, aunque ambos saben que quizá no.',e:{lz:-1,t:.1,h:1}}]}),
'2-9':()=>({h:'🪞 El espejo',t:'Un espejo entero flota entre las minas. En él ves tu rostro… con una máscara blanca encima. La máscara te mira primero.',o:[{b:'Mirarte a los ojos',r:'Lo entiendes: cualquiera que derrote al Rey puede ocupar su lugar. Y a veces, a la máscara le gusta que lo hagan.',e:{f:'espejo',lz:1,h:1}},{b:'Romper el espejo',r:'El espejo explota en mil fragmentos. En cada uno, una máscara distinta te mira mientras caen.',e:{t:.1,lz:-1}}]}),
'2-14':()=>({h:'🗣️ Un trato',t:'La voz sin dueño te habla de cerca: «Puedo abrirte un camino directo al Trono. Solo prométeme algo pequeño: que cuando caiga, me dejes elegir qué pasa con la Corona».',o:[{b:'Aceptar el pacto',s:'Mucho más tiempo y menos minas, pero…',r:'El aire se parte: un sendero de luz negra se abre hasta el Trono. Pero algo en tu pecho ya no es solo tuyo.',e:{t:.3,m:-.1,lz:-2,f:'pacto'}},{b:'Rechazar el pacto',r:'«Qué lástima», responde la voz. Pero tu decisión hace que quienes te siguen te miren distinto.',e:{lz:1,l:1}}]}),
'2-18':()=>({h:'🌙 La última noche',t:'Frente a la puerta del Trono, la noche es larga. Las estrellas apagadas del techo parecen más cerca. Es la última noche antes del duelo.',o:[{b:'Pasarla recordando a los tuyos',s:'Más vidas en el duelo.',r:'Recuerdas a todos los que dejaste atrás y a los que ayudaste. Duermes, con el corazón firme.',e:{bx:{l:1},lz:1}},{b:'Avanzar de inmediato',s:'Más tiempo, menos minas y una pista.',r:'No hay tiempo que perder. Entras antes de que el Rey te espere.',e:{bx:{t:.15,m:-.05},h:1}}]}),
'2-19':()=>({h:'👑 La Corona Rota',t:'La máscara cae al suelo y, con ella, la Corona Rota: completa por primera vez, zumbando como una colmena. Dentro de ella habla la voz del Abismo: «Alguien tiene que ocupar el trono, o todo caerá sobre Aurora». '+(K.f.espejo?'Ya lo habías visto en el espejo: la máscara quiere un rostro nuevo. ':'')+(K.f.pacto?'«Recuerda tu promesa», añade, con dulzura de víbora.':''),o:[{b:'👑 Ponerte la Corona',s:'Tú serás el nuevo soberano.',q:()=>!!K.f.corona,ql:'Necesitas el fragmento del Bosque de Cenizas',r:'Alzas la Corona con ambas manos y la acercas a tu frente…',end:(K.lz>=3&&!K.f.pacto)?'luz':'sombra'},{b:'💔 Romper la Corona',s:'Aurora será libre, pero sin magia.',r:'Apoyas tu arma contra el metal frío y respiras hondo…',end:'rota'},{b:'🤝 Compartir la Corona',s:'Entre todos los que te siguieron.',q:()=>K.al.length>=2,ql:'Necesitas al menos 2 aliados',r:'Llamas a quienes te acompañaron hasta aquí…',end:'cons'}]})};
const EN={
luz:{t:'👑 El Soberano de Aurora',p:()=>['Te pones la Corona Rota y, en lugar de una máscara, aparece tu propio rostro. La voz del Abismo calla: por primera vez, el trono tiene un dueño que recuerda.','Cada noche reacomodas el Abismo, pero ahora en senderos seguros. Los viajeros vuelven a casa y las velas de Aurora se encienden una a una.',K.al.length?lj(K.al.map(an))+(K.al.length>1?' se quedan':' se queda')+' a tu lado como '+(K.al.length>1?'guardianes':'guardián')+' del trono.':'','Las canciones llaman a {n} «el Soberano de la Luz».']},
sombra:{t:'🌑 El Nuevo Rey Sin Rostro',p:()=>['Te pones la Corona Rota. La máscara crece sobre tu rostro, fría y suave, y la voz del Abismo suspira de alivio: «Por fin».','Aurora vuelve a quedar sellada, esta vez en tu nombre. Las minas se reacomodan cada noche y ya no recuerdas por qué importaba.',K.f.pacto?'Cumpliste tu promesa sin darte cuenta: el Rey elegía, y tú solo obedecías.':'Nadie te obliga: es solo que ya no sabes cómo quitártela.','Mil años después, un nuevo héroe cruza las puertas de Aurora. Tú lo esperas, sin rostro.']},
rota:{t:'💔 La Luz sin Magia',p:()=>['Alzas tu arma y rompes la Corona Rota. El Abismo se desmorona como arena y por fin Aurora vuelve a ver el sol.','Pero los poderes antiguos se apagan: la brújula, el escudo, el ojo, el arco, la luz y el reloj quedan en silencio. Los héroes vuelven a ser gente común.',K.al.length?lj(K.al.map(an))+' lo celebra'+(K.al.length>1?'n':'')+' contigo: sin magia, pero sin cadenas.':'Regresas solo, pero la ciudad te recibe con las ventanas abiertas.','Y por primera vez, eso es suficiente.']},
cons:{t:'🤝 El Consejo de Aurora',p:()=>['Divides la Corona Rota en tantos fragmentos como amigos tienes: '+lj(K.al.map(an).concat([K.name]))+'.','Nadie la lleva puesta a solas; entre todos la cuidan. El Abismo se vuelve un jardín de senderos que cambian con las estaciones.','Aurora funda un Consejo donde cada voz cuenta, y el trono queda vacío para siempre.']}};
function ap(e){kn();const g=[],sg=v=>(v>0?'+':'')+Math.round(v*100)+'%';
if(e.lz){K.lz+=e.lz;g.push(e.lz>0?'☀️ Luz +'+e.lz:'🌑 Sombra +'+(-e.lz))}
if(e.c){const m=meta();m.coins+=e.c;saveMeta(m);g.push('🪙 +'+e.c)}
if(e.al){if(K.al.includes(e.al)){const m=meta();m.coins+=10;saveMeta(m);g.push('🪙 +10 (ya era tu aliado)')}else{K.al.push(e.al);g.push('🤝 '+an(e.al)+' se une a ti ('+ALY[e.al].d+')')}}
['l','t','m','h','d'].forEach(k=>{if(e[k])K.nx[k]=(K.nx[k]||0)+e[k]});
if(e.l)g.push('❤️ '+(e.l>0?'+':'')+e.l+' vida en el próximo nivel');
if(e.t)g.push('⏱️ '+sg(e.t)+' de tiempo en el próximo nivel');
if(e.m)g.push('💣 '+sg(e.m)+' de minas en el próximo nivel');
if(e.h)g.push('🔍 +'+e.h+' pista'+(e.h>1?'s':''));
if(e.d)g.push('📡 +'+e.d+' detector'+(e.d>1?'es':''));
if(e.bx){for(const k in e.bx)K.bx[k]=(K.bx[k]||0)+e.bx[k];g.push('👑 Cambia el duelo contra el jefe')}
if(e.f)e.f.split(',').forEach(x=>K.f[x]=1);
return g}
function sd(p){const k=p.c+'-'+p.i;if(MJ[k])return MJ[k]();return CSC[ck(p.c,p.i)][p.v||0]}
function scene(){kn();const p=K.pd;if(!p)return brief();const s=sd(p),z=ck(p.c,p.i),bo=p.i==CP[p.c].L-1;
sc(s.h||(CRE[z]?CRE[z].e+' Tras el combate':'⚖️ Decisión'),[fm(s.t,p.c)],0,0,bo?bpt(p.c):z?cpt(z,90):'');
$('#app').insertAdjacentHTML('beforeend',s.o.map((o,j)=>{const ok=!o.q||o.q();return '<button class=op '+(ok?'onclick="cho('+j+')"':'disabled')+'>'+fm(o.b,p.c)+(o.s?'<small>'+fm(o.s,p.c)+'</small>':'')+(!ok&&o.ql?'<small>🔒 '+o.ql+'</small>':'')+'</button>'}).join(''))}
function cho(j){kn();const p=K.pd;if(!p)return;const s=sd(p),o=s.o[j];if(!o||(o.q&&!o.q()))return;
const r=fm(o.r,p.c),g=ap(o.e||{}),en=o.end;K.pd=0;if(en){K.done=1;K.end=en}ks();
if(en)return ending(en,r);
sc('📖 Tu decisión',[r,g.length?'~'+g.join(' · '):''],'▶ Continuar','brief()')}
function ending(id,r){const E=EN[id];sc('🏆 '+E.t,[r].concat(E.p().map(x=>fm(x)),['<b>Fin.</b> Gracias por jugar, '+K.name+'. Tus 🪙 siguen contigo para despertar a más héroes.','~'+st()]),'Volver al menú','menu()',pt(CH[K.ch].id,120))}
